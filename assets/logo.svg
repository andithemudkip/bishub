<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Open book shape — left page -->
  <path d="
    M 256 200
    Q 210 190 160 210
    L 160 350
    Q 210 330 256 340
    Z
  " fill="#DBEAFE" opacity="0.9"/>

  <!-- Open book shape — right page -->
  <path d="
    M 256 200
    Q 302 190 352 210
    L 352 350
    Q 302 330 256 340
    Z
  " fill="#BFDBFE" opacity="0.9"/>

  <!-- Beam of light projecting upward from the book -->
  <path d="
    M 230 200
    L 190 120
    L 322 120
    L 282 200
    Z
  " fill="#93C5FD" opacity="0.35"/>

  <!-- Brighter inner beam -->
  <path d="
    M 242 200
    L 220 140
    L 292 140
    L 270 200
    Z
  " fill="#93C5FD" opacity="0.25"/>

</svg>

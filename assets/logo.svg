    M 216 185
    L 160 80
    L 352 80
    L 296 185
    Z
  " fill="#BFDBFE" opacity="0.4"/>

  <!-- Brighter inner beam -->
  <path d="
    M 232 185
    L 200 110
    L 312 110
    L 280 185
    Z
  " fill="#DBEAFE" opacity="0.3"/>

  <!-- Open book shape — left page -->
  <path d="
    M 256 185
    Q 196 172 120 198
    L 120 380
    Q 196 354 256 368
    Z
  " fill="#EFF6FF"/>

  <!-- Open book shape — right page -->
  <path d="
    M 256 185
    Q 316 172 392 198
    L 392 380
    Q 316 354 256 368
    Z
  " fill="#DBEAFE"/>

</svg>

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Both platforms we ship: path handling and binaries differ.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Tests mock `electron`; the ~100MB binary is never launched.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build:ttml
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
